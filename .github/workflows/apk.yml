name: Construire APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Lancer les tests disponibles et compiler l'APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Fil-Actualites-debug.apk
      - name: Mettre l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Fil-Actualites-debug
          path: app/build/outputs/apk/debug/Fil-Actualites-debug.apk
          if-no-files-found: error
