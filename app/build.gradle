}

android {
    namespace 'fr.fil.actualites'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.fil.actualites'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
